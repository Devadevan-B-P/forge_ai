<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Anomaly | Forge AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital,wght@0,400;1,400&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: #050505;
      color: #ffffff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Grain Overlay Replica */
    .grain-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0.035;
      pointer-events: none;
      z-index: 9999;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Vignette & Radial Glow */
    .animated-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 20%, rgba(5, 5, 5, 0.9) 100%);
      z-index: 5;
    }

    .radial-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 120, 79, 0.04) 0%, rgba(5, 5, 5, 0) 75%);
      pointer-events: none;
      z-index: 0;
    }

    .glow-blob {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.12) 0%, rgba(249, 115, 22, 0.08) 100%);
      filter: blur(100px);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    /* Navigation Header Replica */
    header {
      position: relative;
      z-index: 10;
      width: 100%;
      padding-top: 24px;
      display: flex;
      justify-content: center;
    }

    .nav-bar {
      background: rgba(18, 21, 28, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .logo {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 19px;
      font-weight: 500;
      text-decoration: none;
      color: #ffffff;
      letter-spacing: -0.01em;
      transition: opacity 0.2s;
    }

    .logo:hover {
      opacity: 0.8;
    }

    .logo-badge {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #FF6B6B, #FF8E53);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-left: 4px;
    }

    /* Main Container */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .error-code {
      font-size: 130px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(180deg, #ffffff 30%, rgba(255,255,255,0.7) 70%, rgba(255,100,100,0.15) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 30px rgba(255, 100, 100, 0.05));
      animation: pulse 6s infinite ease-in-out;
    }

    .error-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      color: #ffffff;
    }

    .error-desc {
      font-size: 14px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
      max-width: 480px;
      margin-bottom: 32px;
    }

    /* Actions Container */
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .btn-primary {
      background-color: #ffffff;
      color: #050505;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      border: none;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
    }

    .btn-secondary {
      background-color: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.05);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 10;
      padding: 24px;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.97); opacity: 0.85; }
    }

    @media (min-width: 640px) {
      .error-code { font-size: 180px; }
      .error-title { font-size: 52px; }
      .error-desc { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="grain-overlay"></div>
  <div class="animated-vignette"></div>
  <div class="radial-bg"></div>
  <div class="glow-blob"></div>

  <header>
    <div class="nav-bar">
      <a href="/" class="logo">
        Forge <span class="logo-badge">AI</span>
      </a>
    </div>
  </header>

  <main>
    <div class="error-code">50X</div>
    <h1 class="error-title">System Anomaly.</h1>
    <p class="error-desc">The Forge service is experiencing temporary resource congestion or background maintenance. The core engines are compiling. Please try refreshing.</p>
    <div class="actions">
      <button onclick="window.location.reload()" class="btn btn-primary">Try Refreshing</button>
      <a href="/" class="btn btn-secondary">Return Home</a>
    </div>
  </main>

  <footer>
    &copy; 2026 Forge AI. All rights reserved.
  </footer>
</body>
</html>
