services:
  redis:
    image: redis:alpine
    container_name: forge_ai_redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forge_ai_backend
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    # Port 8000 remains internal-only to prevent direct outside access.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_EMAILJS_SERVICE_ID=${VITE_EMAILJS_SERVICE_ID}
        - VITE_EMAILJS_TEMPLATE_ID=${VITE_EMAILJS_TEMPLATE_ID}
        - VITE_EMAILJS_PUBLIC_KEY=${VITE_EMAILJS_PUBLIC_KEY}
    container_name: forge_ai_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
